version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: candy_shop
      POSTGRES_USER: candy
      POSTGRES_PASSWORD: candy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candy -d candy_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: >
      sh -c "
        npx typeorm-ts-node-commonjs -d src/database/data-source.ts migration:run &&
        npx ts-node -r tsconfig-paths/register src/database/seeds/seed.ts
      "
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: candy
      DB_PASS: candy
      DB_NAME: candy_shop
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: candy
      DB_PASS: candy
      DB_NAME: candy_shop
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-in-production}
      CHECKOUT_REQUIRES_AUTH: ${CHECKOUT_REQUIRES_AUTH:-true}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
